<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="860" viewBox="0 0 1900 860" role="img" aria-labelledby="title desc">
  <title id="title">ALOHA 推理：输入链与输出链</title>
  <desc id="desc">推理观测没有 actions，跳过 Repack 和 DeltaActions，使用 checkpoint 统计量并添加 B=1。输出端执行 Unnormalize、AbsoluteActions 和 AlohaOutputs，把模型动作块还原为 ALOHA 控制动作。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536777"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3977a8"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d27b34"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#71956a"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#293b49}.title{font-size:35px;font-weight:700}.sub{font-size:18px;fill:#596b78}.lane{font-size:24px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;fill:#465966}.note{font-size:14px;fill:#536573}
      .panel{fill:#fcfdfe;stroke:#9cabb6;stroke-width:2.2}.source{fill:#f1f4f6;stroke:#9aa8b1;stroke-width:2.2}.train-only{fill:#fff1e1;stroke:#d38a4c;stroke-width:2.3}.shared{fill:#e8f1fa;stroke:#5c84a8;stroke-width:2.3}.infer-only{fill:#edf5e9;stroke:#74996b;stroke-width:2.3}.output{fill:#f2eff9;stroke:#9383b1;stroke-width:2.3}
      .arrow{fill:none;stroke:#536777;stroke-width:2.8;marker-end:url(#arrow)}.shared-arrow{fill:none;stroke:#3977a8;stroke-width:2.8;marker-end:url(#blue-arrow)}.train-arrow{fill:none;stroke:#d27b34;stroke-width:2.8;marker-end:url(#orange-arrow)}.infer-arrow{fill:none;stroke:#71956a;stroke-width:2.8;marker-end:url(#green-arrow)}
    </style>
  </defs>
  <rect width="1900" height="860" fill="#fff"/>
  <text class="title" x="950" y="40" text-anchor="middle">ALOHA 推理：输入链与输出链</text>
  <text class="sub" x="950" y="72" text-anchor="middle">推理观测没有 actions，跳过 Repack / DeltaActions；输出端还原为 ALOHA 控制动作</text>

  <g transform="translate(0,-400)">
    <rect class="panel" x="45" y="485" width="1810" height="325" rx="13"/>
    <text class="lane" x="78" y="529">推理输入：客户端观测没有 actions，随后补 batch 维 B=1</text>
    <rect class="source" x="80" y="575" width="230" height="185" rx="10"/>
    <text class="head" x="195" y="610" text-anchor="middle">客户端 observation</text>
    <text class="body" x="195" y="647" text-anchor="middle">images + state</text><text class="body" x="195" y="675" text-anchor="middle">不含 actions</text><text class="note" x="195" y="714" text-anchor="middle">已使用策略约定的 key</text>

    <rect class="infer-only" x="340" y="575" width="230" height="185" rx="10"/>
    <text class="head" x="455" y="610" text-anchor="middle">Repack 省略</text>
    <text class="body" x="455" y="647" text-anchor="middle">推理端默认空 Group</text><text class="body" x="455" y="675" text-anchor="middle">无需重命名数据集 key</text>

    <rect class="shared" x="600" y="575" width="230" height="185" rx="10"/>
    <text class="head" x="715" y="610" text-anchor="middle">③ AlohaInputs</text>
    <text class="body" x="715" y="647" text-anchor="middle">与训练相同的相机、</text><text class="body" x="715" y="675" text-anchor="middle">图像及关节适配</text><text class="note" x="715" y="714" text-anchor="middle">但输入中没有 actions</text>

    <rect class="infer-only" x="860" y="575" width="230" height="185" rx="10"/>
    <text class="head" x="975" y="610" text-anchor="middle">④ DeltaActions 跳过</text>
    <text class="body" x="975" y="647" text-anchor="middle">actions key 不存在</text><text class="body" x="975" y="675" text-anchor="middle">Normalize 使用 checkpoint</text><text class="note" x="975" y="714" text-anchor="middle">与训练相同的变换</text>

    <rect class="shared" x="1120" y="575" width="230" height="185" rx="10"/>
    <text class="head" x="1235" y="610" text-anchor="middle">⑥–⑧ 同一组模型变换</text>
    <text class="body" x="1235" y="647" text-anchor="middle">prompt / Resize / Tokenize</text><text class="body" x="1235" y="675" text-anchor="middle">Pad state 到 32 维</text><text class="note" x="1235" y="714" text-anchor="middle">prompt 含 state 由配置决定</text>

    <rect class="infer-only" x="1380" y="575" width="230" height="185" rx="10"/>
    <text class="head" x="1495" y="610" text-anchor="middle">⑨ Policy.infer</text>
    <text class="body" x="1495" y="647" text-anchor="middle">单样本加 batch 维</text><text class="body" x="1495" y="675" text-anchor="middle">B = 1</text>

    <rect class="infer-only" x="1640" y="575" width="210" height="185" rx="10"/>
    <text class="head" x="1745" y="610" text-anchor="middle">模型输入（B=1）</text>
    <text class="body" x="1745" y="647" text-anchor="middle">images ×3，224×224</text><text class="body" x="1745" y="675" text-anchor="middle">state + prompt</text><text class="body" x="1745" y="703" text-anchor="middle">actions 不存在</text><text class="note" x="1745" y="731" text-anchor="middle">model tensors</text>

    <path class="arrow" d="M310 667H340"/><path class="infer-arrow" d="M570 667H600"/><path class="shared-arrow" d="M830 667H860"/><path class="infer-arrow" d="M1090 667H1120"/><path class="shared-arrow" d="M1350 667H1380"/><path class="infer-arrow" d="M1610 667H1640"/>

    <rect class="panel" x="45" y="840" width="1810" height="315" rx="13"/>
    <text class="lane" x="78" y="884">仅推理：把模型输出还原为 ALOHA 控制动作</text>
    <rect class="output" x="80" y="930" width="300" height="150" rx="10"/>
    <text class="head" x="230" y="968" text-anchor="middle">模型动作块</text><text class="body" x="230" y="1002" text-anchor="middle">[H,32]，归一化 delta</text><text class="note" x="230" y="1040" text-anchor="middle">网络输出</text>
    <rect class="output" x="440" y="930" width="300" height="150" rx="10"/>
    <text class="head" x="590" y="968" text-anchor="middle">Unnormalize</text><text class="body" x="590" y="1002" text-anchor="middle">使用 checkpoint 统计量</text><text class="note" x="590" y="1040" text-anchor="middle">回到动作原始量纲</text>
    <rect class="output" x="800" y="930" width="300" height="150" rx="10"/>
    <text class="head" x="950" y="968" text-anchor="middle">AbsoluteActions</text><text class="body" x="950" y="1002" text-anchor="middle">臂关节 delta 加回当前 state</text><text class="note" x="950" y="1040" text-anchor="middle">夹爪维不做 delta 还原</text>
    <rect class="output" x="1160" y="930" width="300" height="150" rx="10"/>
    <text class="head" x="1310" y="968" text-anchor="middle">AlohaOutputs</text><text class="body" x="1310" y="1002" text-anchor="middle">关节 / 夹爪表示还原</text><text class="note" x="1310" y="1040" text-anchor="middle">切掉 padding：32 → 14</text>
    <rect class="infer-only" x="1520" y="930" width="300" height="150" rx="10"/>
    <text class="head" x="1670" y="968" text-anchor="middle">返回机器人客户端</text><text class="body" x="1670" y="1002" text-anchor="middle">ALOHA actions [H,14]</text><text class="note" x="1670" y="1040" text-anchor="middle">逐步执行动作块</text>
    <path class="arrow" d="M380 1005H440"/><path class="arrow" d="M740 1005H800"/><path class="arrow" d="M1100 1005H1160"/><path class="arrow" d="M1460 1005H1520"/>

    <rect class="source" x="700" y="1180" width="25" height="20" rx="3"/><text class="note" x="735" y="1196">数据源</text>
    <rect class="shared" x="810" y="1180" width="25" height="20" rx="3"/><text class="note" x="845" y="1196">训练 / 推理共用</text>
    <rect class="infer-only" x="965" y="1180" width="25" height="20" rx="3"/><text class="note" x="1000" y="1196">推理专属</text>
    <rect class="output" x="1090" y="1180" width="25" height="20" rx="3"/><text class="note" x="1125" y="1196">推理输出链</text>
    <text class="note" x="950" y="1232" text-anchor="middle">推理输入没有 actions，跳过 Repack 与 DeltaActions；输出端执行推理专属的还原链。</text>
  </g>
</svg>
